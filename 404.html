<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document not found | Doxemi</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F5F2EA; --ink:#1C1D22; --ink-soft:#55575F; --accent:#2B5FCE; --line:#DEDAD0; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; text-align:center; }
  .card{ max-width:480px; }
  h1{ font-family:'Source Serif 4',serif; font-size:2rem; margin:18px 0 10px; }
  p{ color:var(--ink-soft); line-height:1.6; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; padding:12px 22px; border-radius:4px; font-weight:600; text-decoration:none; margin:6px; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-ghost{ border:1.5px solid var(--line); color:var(--ink); }
  .popular{ margin-top:28px; text-align:left; border-top:1px solid var(--line); padding-top:18px; }
  .popular h2{ font-size:0.85rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); font-family:'Inter',sans-serif; }
  .popular a{ display:block; padding:8px 0; color:var(--accent); text-decoration:none; font-weight:500; }
</style>
</head>
<body>
  <div class="card">
    <svg width="46" height="46" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M6 2.5H19L24.5 8V27.5H6V2.5Z" stroke="#2B5FCE" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 2.5V8H24.5" stroke="#2B5FCE" stroke-width="1.6" stroke-linejoin="round"/><line x1="9.5" y1="14" x2="21" y2="14" stroke="#2B5FCE" stroke-width="1.4" stroke-linecap="round"/><line x1="9.5" y1="18" x2="17" y2="18" stroke="#2B5FCE" stroke-width="1.4" stroke-linecap="round"/></svg>
    <h1>Oops! Document not found.</h1>
    <p>The page you're looking for doesn't exist. It may have moved, or the link may be out of date.</p>
    <div>
      <a class="btn btn-primary" id="home-link" href="./">Back Home</a>
      <a class="btn btn-ghost" id="tools-link" href="./#/tools">Explore Tools</a>
    </div>
    <div class="popular">
      <h2>Popular tools</h2>
      <a id="pop-1" href="./#/tool/docx-to-pdf">DOCX to PDF</a>
      <a id="pop-2" href="./#/tool/csv-to-json">CSV to JSON</a>
      <a id="pop-3" href="./#/tool/txt-word-counter">TXT Word Counter</a>
    </div>
  </div>
  <script>
    // GitHub Pages serves 404.html at whatever depth the broken URL was,
    // so relative links above only work at the site root. This computes
    // the project's base path (e.g. /REPOSITORY/) and rewrites them.
    (function () {
      var segments = location.pathname.split('/').filter(Boolean);
      var isGithubIo = /\.github\.io$/.test(location.hostname);
      var base = (isGithubIo && segments.length > 0) ? '/' + segments[0] + '/' : '/';
      var map = {
        'home-link': base,
        'tools-link': base + '#/tools',
        'pop-1': base + '#/tool/docx-to-pdf',
        'pop-2': base + '#/tool/csv-to-json',
        'pop-3': base + '#/tool/txt-word-counter'
      };
      Object.keys(map).forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.setAttribute('href', map[id]);
      });
    })();
  </script>
</body>
</html>
